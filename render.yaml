services:
  - type: web
    name: ropastore
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /dashboard
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
