# ===================================================================
# RopaStore — Perfil Desarrollo Local (H2 en modo PostgreSQL)
# Permite arranque y pruebas inmediatas sin servicio PostgreSQL externo
# ===================================================================
spring.datasource.url=jdbc:h2:mem:ropastore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=false

# Consola H2 para inspección durante desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
