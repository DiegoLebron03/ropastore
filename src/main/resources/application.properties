# ===================================================================
# RopaStore — Configuración Principal
# ===================================================================
spring.application.name=ropastore
server.port=8080

# Perfil activo por defecto (dev usa base compatible; postgres activa PostgreSQL con Flyway)
spring.profiles.active=dev

# Configuración Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# JPA & Hibernate comunes
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Mensajes y formateo
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Subida y Gestión de Archivos / Imágenes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
