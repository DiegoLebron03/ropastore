<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar Sesión — RopaStore</title>
    
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    
    <!-- RopaStore Official Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/ropastore.css?v=2.2}"/>

    <style>
        .rs-login-page {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #F0FDF4 0%, #F8FAFC 90%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .rs-login-card {
            width: 100%;
            max-width: 440px;
            background-color: var(--rs-white);
            border-radius: 16px;
            border: 1px solid var(--rs-slate-200);
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            padding: 36px 32px;
        }
        .rs-login-logo {
            height: 48px;
            width: auto;
            object-fit: contain;
        }
        .rs-demo-credentials {
            background-color: var(--rs-slate-50);
            border: 1px dashed var(--rs-slate-300);
            border-radius: 10px;
            padding: 12px 14px;
        }
    </style>
</head>
<body class="rs-login-page">

<div class="rs-login-card">
    <div class="text-center mb-4">
        <img th:src="@{/images/logo.png}" alt="RopaStore Logo" class="rs-login-logo mb-2"/>
        <h1 class="h4 fw-bold text-dark mb-1">Iniciar Sesión</h1>
        <p class="text-muted small mb-0">Ingresa tus credenciales para acceder al inventario</p>
    </div>

    <!-- Mensaje de Error -->
    <div th:if="${errorMensaje}" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-3" role="alert">
        <span class="material-symbols-outlined" style="font-size: 20px;">error</span>
        <span th:text="${errorMensaje}" class="small">Usuario o contraseña incorrectos.</span>
    </div>

    <!-- Mensaje Informativo (Logout, etc.) -->
    <div th:if="${infoMensaje}" class="alert alert-success d-flex align-items-center gap-2 py-2 px-3 mb-3" role="alert">
        <span class="material-symbols-outlined" style="font-size: 20px;">check_circle</span>
        <span th:text="${infoMensaje}" class="small">Has cerrado sesión correctamente.</span>
    </div>

    <form th:action="@{/login}" method="post" id="loginForm" autocomplete="off">
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold small text-secondary">Usuario</label>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted">
                    <span class="material-symbols-outlined" style="font-size: 18px;">person</span>
                </span>
                <input type="text"
                       class="form-control border-start-0 ps-1"
                       id="username"
                       name="username"
                       th:value="${username}"
                       placeholder="Ej. Admin"
                       required
                       autofocus/>
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold small text-secondary">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted">
                    <span class="material-symbols-outlined" style="font-size: 18px;">lock</span>
                </span>
                <input type="password"
                       class="form-control border-start-0 border-end-0 ps-1"
                       id="password"
                       name="password"
                       placeholder="••••••••"
                       required/>
                <button class="btn btn-outline-secondary border-start-0 bg-white"
                        type="button"
                        id="togglePassword"
                        onclick="togglePasswordVisibility()"
                        title="Mostrar u ocultar contraseña">
                    <span class="material-symbols-outlined" id="toggleIcon" style="font-size: 18px;">visibility</span>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 mb-3">
            <span class="material-symbols-outlined" style="font-size: 20px;">login</span>
            <span>Ingresar al Sistema</span>
        </button>
    </form>

    <!-- Caja de credenciales de demostración -->
    <div class="rs-demo-credentials mb-3">
        <div class="d-flex align-items-start gap-2 mb-2">
            <span class="material-symbols-outlined text-primary flex-shrink-0" style="font-size: 20px;">info</span>
            <div class="flex-grow-1">
                <div class="fw-semibold small text-dark">Acceso de Demostración</div>
                <div class="text-muted" style="font-size: 0.78rem;">
                    Usuario: <strong class="text-dark">Admin</strong> &nbsp;|&nbsp;
                    Clave: <strong class="text-dark">1234</strong>
                </div>
            </div>
        </div>
        <button type="button"
                class="btn btn-sm btn-outline-success w-100 py-1"
                onclick="fillDemoCredentials()"
                style="font-size: 0.8rem;">
            Rellenar credenciales de prueba
        </button>
    </div>

    <div class="text-center text-muted" style="font-size: 0.75rem;">
        RopaStore &bull; Proyecto de demostración
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        var pwd = document.getElementById('password');
        var icon = document.getElementById('toggleIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            pwd.type = 'password';
            icon.textContent = 'visibility';
        }
    }

    function fillDemoCredentials() {
        document.getElementById('username').value = 'Admin';
        document.getElementById('password').value = '1234';
    }
</script>

</body>
</html>
