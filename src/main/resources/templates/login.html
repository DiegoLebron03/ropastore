<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar Sesión — RopaStore</title>
    
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    
    <!-- RopaStore Official Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/ropastore.css?v=2.3}"/>

    <style>
        .rs-login-page {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #F0FDF4 0%, #F8FAFC 90%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .rs-login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--rs-white);
            border-radius: 16px;
            border: 1px solid var(--rs-slate-200);
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            padding: 36px 32px;
        }
        .rs-login-logo {
            height: 54px;
            width: auto;
            max-width: 230px;
            object-fit: contain;
        }
        .rs-login-label {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--rs-slate-500);
            margin-bottom: 6px;
            display: block;
            transition: color 0.15s ease, font-weight 0.15s ease;
        }
        .rs-login-field:focus-within .rs-login-label {
            color: var(--rs-slate-800);
            font-weight: 600;
        }
        .rs-login-input-group {
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            overflow: hidden;
            background-color: #ffffff;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .rs-login-input-group .input-group-text {
            background-color: #ffffff;
            border: none;
            color: var(--rs-slate-400);
            padding-left: 12px;
            padding-right: 4px;
        }
        .rs-login-input-group .form-control {
            border: none !important;
            box-shadow: none !important;
            outline: none !important;
            font-size: 0.9rem;
            color: var(--rs-slate-800);
            padding: 10px 12px;
        }
        .rs-login-input-group .form-control::placeholder {
            color: var(--rs-slate-400);
        }
        .rs-login-input-group .btn-toggle-pwd {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            outline: none !important;
            color: var(--rs-slate-400);
            padding: 0 12px;
        }
        .rs-login-input-group .btn-toggle-pwd:hover {
            color: var(--rs-slate-600);
        }
        .rs-login-field:focus-within .rs-login-input-group {
            border-color: #94A3B8;
            box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.18);
        }
        .rs-login-btn {
            background-color: var(--rs-primary) !important;
            border-color: var(--rs-primary) !important;
            color: #ffffff !important;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px;
            padding: 11px 16px;
            transition: all 0.15s ease-in-out;
        }
        .rs-login-btn:hover {
            background-color: var(--rs-primary-dark) !important;
            border-color: var(--rs-primary-dark) !important;
            color: #ffffff !important;
        }
        .rs-login-btn:active {
            background-color: #146c43 !important;
            border-color: #146c43 !important;
        }
        .rs-demo-hint {
            color: #64748B;
            font-size: 0.82rem;
            letter-spacing: 0.01em;
            user-select: none;
        }
        .rs-demo-hint strong {
            color: #334155;
        }
    </style>
</head>
<body class="rs-login-page">

<div class="rs-login-card">
    <div class="text-center mb-4">
        <img th:src="@{/images/logo.png}" alt="RopaStore Logo" class="rs-login-logo mb-3"/>
        <h1 class="h4 fw-bold text-dark mb-0">Iniciar Sesión</h1>
    </div>

    <!-- Mensaje de Error -->
    <div th:if="${errorMensaje}" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-3" role="alert">
        <span class="material-symbols-outlined" style="font-size: 20px;">error</span>
        <span th:text="${errorMensaje}" class="small">Usuario o contraseña incorrectos.</span>
    </div>

    <!-- Mensaje Informativo (Logout, etc.) -->
    <div th:if="${infoMensaje}" class="alert alert-success d-flex align-items-center gap-2 py-2 px-3 mb-3" role="alert">
        <span class="material-symbols-outlined" style="font-size: 20px;">check_circle</span>
        <span th:text="${infoMensaje}" class="small">Has cerrado sesión correctamente.</span>
    </div>

    <form th:action="@{/login}" method="post" id="loginForm" autocomplete="off">
        <div class="mb-3 rs-login-field">
            <label for="username" class="rs-login-label">Usuario</label>
            <div class="input-group rs-login-input-group">
                <span class="input-group-text">
                    <span class="material-symbols-outlined" style="font-size: 18px;">person</span>
                </span>
                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       th:value="${username}"
                       placeholder="Ej. Admin"
                       required
                       autofocus/>
            </div>
        </div>

        <div class="mb-4 rs-login-field">
            <label for="password" class="rs-login-label">Contraseña</label>
            <div class="input-group rs-login-input-group">
                <span class="input-group-text">
                    <span class="material-symbols-outlined" style="font-size: 18px;">lock</span>
                </span>
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="••••••••"
                       required/>
                <button class="btn btn-toggle-pwd"
                        type="button"
                        id="togglePassword"
                        onclick="togglePasswordVisibility()"
                        title="Mostrar u ocultar contraseña">
                    <span class="material-symbols-outlined" id="toggleIcon" style="font-size: 18px;">visibility</span>
                </button>
            </div>
        </div>

        <button type="submit" class="btn rs-login-btn w-100">
            Iniciar sesión
        </button>
    </form>
</div>

<!-- Acceso de prueba fuera del modal, en tono gris sutil -->
<div class="text-center mt-3 rs-demo-hint" onclick="fillDemoCredentials()" style="cursor: pointer;" title="Clic para auto-completar credenciales">
    Acceso de prueba: <span>Usuario:</span> <strong>Admin</strong> &nbsp;&bull;&nbsp; <span>Contraseña:</span> <strong>1234</strong>
</div>

<script>
    function togglePasswordVisibility() {
        var pwd = document.getElementById('password');
        var icon = document.getElementById('toggleIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            pwd.type = 'password';
            icon.textContent = 'visibility';
        }
    }

    function fillDemoCredentials() {
        document.getElementById('username').value = 'Admin';
        document.getElementById('password').value = '1234';
    }
</script>

</body>
</html>
