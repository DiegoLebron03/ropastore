<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="rs-sidebar select-none">
    <div class="d-flex flex-column flex-grow-1 overflow-auto">
        <!-- Brand Header (Interactivo: clic para plegar/desplegar) -->
        <div class="rs-brand d-flex align-items-center justify-content-between" onclick="toggleSidebar()" role="button" title="Plegar / Desplegar menú lateral">
            <div class="d-flex align-items-center text-decoration-none text-dark flex-grow-1 min-w-0" style="cursor: pointer;">
                <img th:src="@{/images/logo.png}" alt="RopaStore Logo" class="rs-brand-logo-full"/>
                <img th:src="@{/images/logo-icon.png}" alt="RopaStore Icon" class="rs-brand-logo-icon"/>
            </div>
            <button class="btn btn-sm btn-light border d-lg-none p-1 text-muted" type="button" onclick="event.stopPropagation(); closeMobileSidebar()" aria-label="Cerrar menú">
                <span class="material-symbols-outlined" style="font-size: 20px;">close</span>
            </button>
        </div>

        <!-- Grupo Operaciones -->
        <div class="rs-nav-group-title">Operaciones</div>
        <nav class="d-flex flex-column">
            <a th:href="@{/dashboard}"
               class="rs-nav-item"
               title="Dashboard"
               th:classappend="${activeNav == 'dashboard'} ? 'active' : ''">
                <div class="rs-nav-item-icon">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span>Dashboard</span>
                </div>
                <span class="badge rounded-pill bg-success-subtle text-success font-monospace" style="font-size: 0.7rem;">Live</span>
            </a>

            <a th:href="@{/productos}"
               class="rs-nav-item"
               title="Productos"
               th:classappend="${activeNav == 'productos'} ? 'active' : ''">
                <div class="rs-nav-item-icon">
                    <span class="material-symbols-outlined">apparel</span>
                    <span>Productos</span>
                </div>
            </a>

            <a th:href="@{/inventario/operaciones}"
               class="rs-nav-item"
               title="Entradas / Salidas"
               th:classappend="${activeNav == 'operaciones'} ? 'active' : ''">
                <div class="rs-nav-item-icon">
                    <span class="material-symbols-outlined">sync_alt</span>
                    <span>Entradas / Salidas</span>
                </div>
            </a>

            <a th:href="@{/inventario/movimientos}"
               class="rs-nav-item"
               title="Movimientos"
               th:classappend="${activeNav == 'movimientos'} ? 'active' : ''">
                <div class="rs-nav-item-icon">
                    <span class="material-symbols-outlined">receipt_long</span>
                    <span>Movimientos</span>
                </div>
            </a>
        </nav>

        <!-- Grupo Gestión & Reportes -->
        <div class="rs-nav-group-title mt-2">Gestión & Análisis</div>
        <nav class="d-flex flex-column">
            <a th:href="@{/reportes}"
               class="rs-nav-item"
               title="Reportes TXT"
               th:classappend="${activeNav == 'reportes'} ? 'active' : ''">
                <div class="rs-nav-item-icon">
                    <span class="material-symbols-outlined">description</span>
                    <span>Reportes TXT</span>
                </div>
            </a>
        </nav>
    </div>

    <!-- Sidebar Footer / Perfil -->
    <div class="rs-sidebar-footer">
        <div class="rs-user-profile d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2 overflow-hidden min-w-0">
                <div class="rs-user-avatar d-flex align-items-center justify-content-center rounded-circle flex-shrink-0" style="width: 36px; height: 36px; background-color: #E2E8F0; color: #475569;">
                    <span class="material-symbols-outlined" style="font-size: 20px;">person</span>
                </div>
                <div class="flex-grow-1 overflow-hidden min-w-0">
                    <div class="rs-user-name text-truncate" th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre : 'Admin'}">Admin</div>
                    <div class="rs-user-role text-truncate" th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.rol : 'ADMIN'}">ADMIN</div>
                </div>
            </div>
            <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger p-1 border-0 rounded-circle d-flex align-items-center justify-content-center flex-shrink-0 rs-logout-btn" title="Cerrar sesión" aria-label="Cerrar sesión">
                <span class="material-symbols-outlined" style="font-size: 18px;">logout</span>
            </a>
        </div>
    </div>
</aside>
</body>
</html>
