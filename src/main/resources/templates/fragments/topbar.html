<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar" class="rs-topbar">
    <div class="d-flex align-items-center gap-2 gap-sm-3 min-w-0">
        <button class="btn btn-sm btn-light border d-lg-none p-1.5 text-secondary flex-shrink-0" type="button" onclick="toggleSidebar()" aria-label="Abrir menú" title="Abrir menú">
            <span class="material-symbols-outlined" style="font-size: 20px;">menu</span>
        </button>
        <div class="d-flex align-items-center gap-1.5 text-secondary overflow-hidden text-truncate" style="font-size: 0.88rem;">
            <span class="material-symbols-outlined text-muted flex-shrink-0" style="font-size: 18px;">store</span>
            <span class="fw-medium text-dark text-truncate d-none d-sm-inline">Almacén Central</span>
            <span class="text-muted d-none d-sm-inline">/</span>
            <span class="text-secondary fw-semibold text-truncate" th:text="${activeNav == 'dashboard' ? 'Dashboard' : (activeNav == 'productos' ? 'Productos' : (activeNav == 'operaciones' ? 'Operaciones' : (activeNav == 'movimientos' ? 'Movimientos' : 'Reportes')))}">Sección</span>
        </div>
        <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2 py-0.5 d-none d-md-inline-flex align-items-center gap-1 flex-shrink-0" style="font-size: 0.72rem;">
            <span class="bg-success rounded-circle d-inline-block" style="width: 6px; height: 6px;"></span>
            <span>Abierto</span>
        </span>
    </div>

    <div class="d-flex align-items-center gap-2 gap-sm-3 flex-shrink-0">
        <!-- Avatar -->
        <img th:src="@{/images/avatar.png}" alt="Avatar" class="rounded-circle border flex-shrink-0" style="width: 34px; height: 34px; object-fit: cover;"/>
    </div>
</header>
</body>
</html>
